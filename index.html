:root {
  --bg: #f3f5f8; --card: #fff; --ink: #1b2430; --muted: #66707d; --line: #dde2e8;
  --pri: #0b4f8a; --pri-ink: #fff; --c: #16794a; --c-bg: #e3f4ea; --nc: #b42318; --nc-bg: #fdecea;
  --na: #5b6472; --na-bg: #eceef1; --x: #7a0916; --warn-bg: #fff4d6; --warn-line: #f0c75e;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 Vazirmatn, Tahoma, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
h2 { font-size: 1.2rem; margin: .4rem 0; } h3 { font-size: 1.02rem; margin: 0 0 .6rem; } h4 { margin: 1rem 0 .4rem; font-size: .95rem; }
.ltr { unicode-bidi: isolate; }

.top { position: sticky; top: 0; z-index: 10; background: var(--pri); color: var(--pri-ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.top-in { max-width: 920px; margin: 0 auto; padding: .4rem 16px; display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.brand { font-weight: 700; }
nav { display: flex; gap: .25rem; }
.nav-b { background: transparent; border: 0; color: inherit; opacity: .8; padding: .35rem .7rem; border-radius: 8px; cursor: pointer; }
.nav-b.on { background: rgba(255,255,255,.18); opacity: 1; font-weight: 700; }
.wrap { max-width: 920px; margin: 0 auto; padding: 12px 16px 80px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 10px 0; display: block; width: 100%; text-align: inherit; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
.actions.col { flex-direction: column; margin: 0; }
.hint { color: var(--muted); font-size: .85rem; margin: .4rem 0; } .center { text-align: center; }
.empty { color: var(--muted); text-align: center; padding: 1.5rem .5rem; }

.btn { border: 1px solid var(--line); background: #fff; padding: .5rem .9rem; border-radius: 9px; cursor: pointer; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--pri); }
.btn.primary { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); }
.btn.danger { color: var(--nc); border-color: #f1b8b2; }
.btn.ghost { background: transparent; }
.btn.sm { padding: .2rem .6rem; min-height: 32px; font-size: .85rem; }
.btn.block { display: block; width: 100%; margin: 10px 0; }
.btn:disabled { opacity: .45; cursor: default; }

.banner { border: 1px solid var(--warn-line); background: var(--warn-bg); padding: .6rem .8rem; border-radius: 10px; margin: 8px 0; }
.banner.err { border-color: #f1b8b2; background: var(--nc-bg); }
.search { width: 100%; padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: #fff; }

.list-item { cursor: pointer; }
.list-item:hover { border-color: var(--pri); }
.li-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.li-meta { color: var(--muted); font-size: .85rem; }
.badge { font-size: .75rem; padding: .1rem .55rem; border-radius: 99px; background: var(--na-bg); color: var(--na); white-space: nowrap; }
.badge.final { background: var(--c-bg); color: var(--c); }
.t-nc { color: var(--nc); } .t-x { color: var(--x); font-weight: 700; }

.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
.choices.col { grid-template-columns: 1fr; }
.choice { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: .6rem; cursor: pointer; text-align: inherit; display: flex; flex-direction: column; }
.choice small { color: var(--muted); }
.choice.on { border-color: var(--pri); background: #eaf2fa; }
select { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 9px; background: #fff; }

fieldset.form { border: 0; padding: 0; margin: 0; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .2rem .8rem; }
.fld { display: flex; flex-direction: column; margin: .25rem 0; }
.fld > span { font-size: .8rem; color: var(--muted); }
.fld input, .fld textarea, .note, .sec-title, .adm-fields textarea, .adm-fields input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.fld.short { max-width: 200px; }
.static { padding: .45rem 0; }
fieldset:disabled input, fieldset:disabled textarea, fieldset:disabled select { background: #f7f8fa; color: var(--ink); border-color: transparent; }
textarea { resize: vertical; }

.prog { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.sec { border: 1px solid var(--line); border-radius: 10px; margin: .5rem 0; }
.sec > summary { cursor: pointer; padding: .6rem .8rem; display: flex; justify-content: space-between; gap: .5rem; font-weight: 700; list-style: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: '◂'; margin-left: .4rem; color: var(--muted); }
.sec[open] > summary::before { content: '▾'; }
.sec > .btn { margin: 0 .8rem .7rem; }
.item { border-top: 1px solid var(--line); padding: .7rem .8rem; border-right: 4px solid transparent; }
.item.s-C { border-right-color: var(--c); } .item.s-NC { border-right-color: var(--nc); background: #fffafa; } .item.s-NA { border-right-color: var(--na); }
.item.imminent { background: var(--nc-bg); border-right-color: var(--x); }
.item-q { display: flex; gap: .5rem; }
.num { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--na-bg); display: grid; place-items: center; font-size: .8rem; }
.ref { color: var(--muted); font-size: .78rem; }

<script>// ---------- Storage: IndexedDB, falling back to localStorage, then memory ----------
// Some ways of opening a local file (e.g. Android content:// links) block IndexedDB.
const DB = (() => {
  const STORES = ['kv', 'inspections', 'workplaces', 'photos'];
  let dbp, backend = 'indexeddb';
  const kvBackend = (store) => {
    const k = (s, id) => `ic:${s}:${id}`;
    return {
      get: async (s, id) => { const v = store.getItem(k(s, id)); return v ? JSON.parse(v) : undefined; },
      all: async (s) => { const out = []; for (let i = 0; i < store.length; i++) { const key = store.key(i); if (key.startsWith(`ic:${s}:`)) out.push(JSON.parse(store.getItem(key))); } return out; },
      put: async (s, v) => { store.setItem(k(s, v.id), JSON.stringify(v)); },
      del: async (s, id) => { store.removeItem(k(s, id)); },
      clear: async (s) => { for (const key of Object.keys(store)) if (key.startsWith(`ic:${s}:`)) store.removeItem(key); }
    };
  };
  const memStore = () => { const m = new Map(); return { get length() { return m.size; }, key: (i) => [...m.keys()][i], getItem: (k) => m.has(k) ? m.get(k) : null, setItem: (k, v) => m.set(k, v), removeItem: (k) => m.delete(k) }; };
  let fallback = null;
  async function init() {
    try {
      await Promise.race([openIdb(), new Promise((_, rej) => setTimeout(() => rej(new Error('idb timeout')), 3000))]);
      return backend;
    } catch (e) { /* fall through */ }
    try {
      localStorage.setItem('ic:test', '1'); localStorage.removeItem('ic:test');
      fallback = kvBackend(localStorage); backend = 'localstorage';
    } catch (e) { fallback = kvBackend(memStore()); backend = 'memory'; }
    return backend;
  }
  function openIdb() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open('inspection-checklist', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const db = await openIdb();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => resolve(r && 'result' in r ? r.result : undefined);
      t.onerror = () => reject(t.error);
    });
  }
  return {
    init,
    get backend() { return backend; },
    get: (s, id) => fallback ? fallback.get(s, id) : tx(s, 'readonly', st => st.get(id)),
    all: (s) => fallback ? fallback.all(s) : tx(s, 'readonly', st => st.getAll()),
    put: (s, v) => fallback ? fallback.put(s, v) : tx(s, 'readwrite', st => st.put(v)),
    del: (s, id) => fallback ? fallback.del(s, id) : tx(s, 'readwrite', st => st.delete(id)),
    clear: (s) => fallback ? fallback.clear(s) : tx(s, 'readwrite', st => st.clear())
  };
})();

// ---------- Text & numbers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const faDigits = (s) => String(s ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const enDigits = (s) => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Non-cryptographic hash; admin password is light protection only.
function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (const ch of 'ic-salt:' + str) {
    const c = ch.codePointAt(0);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// ---------- Jalali calendar ----------
const Jalali = (() => {
  function g2j(gy, gm, gd) {
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    const gy2 = gm > 2 ? gy + 1 : gy;
    let days = 355666 + 365 * gy + ~~((gy2 + 3) / 4) - ~~((gy2 + 99) / 100) + ~~((gy2 + 399) / 400) + gd + g_d_m[gm - 1];
    let jy = -1595 + 33 * ~~(days / 12053); days %= 12053;
    jy += 4 * ~~(days / 1461); days %= 1461;
    if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
    const jm = days < 186 ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);
    const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
    return [jy, jm, jd];
  }
  function j2g(jy, jm, jd) {
    jy += 1595;
    let days = -355668 + 365 * jy + ~~(jy / 33) * 8 + ~~(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
    let gy = 400 * ~~(days / 146097); days %= 146097;
    if (days > 36524) { gy += 100 * ~~(--days / 36524); days %= 36524; if (days >= 365) days++; }
    gy += 4 * ~~(days / 1461); days %= 1461;
    if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
    let gd = days + 1;
    const leap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
    const ml = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    let gm = 0;
    for (gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm];
    return [gy, gm, gd];
  }
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = ([y, m, d]) => `${y}/${pad(m)}/${pad(d)}`;
  function parse(s) {

function attachSignaturePad(canvas, lineWidth = 2.4) {
  const ctx = canvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  ctx.scale(ratio, ratio);
  ctx.lineWidth = lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b2a6b';
  let drawing = false, dirty = false, last = null;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); e.preventDefault(); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke();
    last = p; dirty = true; e.preventDefault();
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  return {
    clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); dirty = false; },
    isEmpty: () => !dirty,
    toDataURL() {
      // Trim transparent margins so the stamp sits tightly in the signature box.
      const { width: w, height: h } = canvas;
      const data = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }

      c.getContext('2d').drawImage(canvas, x0, y0, x1 - x0, y1 - y0, pad, pad, x1 - x0, y1 - y0);
      return c.toDataURL('image/png');
    }
  };
}

const STATE_LABEL = { C: 'منطبق', NC: 'نامنطبق', NA: 'غیرمرتبط' };
const FU_STATE_LABEL = { C: 'رفع شده', NC: 'رفع نشده', NA: 'موضوعیت ندارد' };
const fa = (s) => esc(faDigits(s));
const dash = (s) => (s === '' || s == null ? '—' : fa(s));

// meta: { no, date, attach }
function letterhead(meta) {
  const st = S.settings, lh = st.letterhead;
  return `<div class="p-head">
    <div class="p-logo">${st.logo ? `<img src="${st.logo}" alt="">` : ''}</div>
    <div class="p-org">${[lh.line1, lh.line2, lh.line3].filter(Boolean).map((l, i) => `<div class="l${i + 1}">${esc(l)}</div>`).join('')}</div>
    <div class="p-meta">
      <div>شماره: ${meta.no === '—' ? '—' : ltr(meta.no)}</div>
      <div>تاریخ: ${fa(meta.date)}</div>
      <div>پیوست: ${meta.attach}</div>
    </div>
  </div>`;
}

function signature(insp) {
  const p = S.settings.profile;
  return `<div class="p-sign">
    <div>${esc(p.name)}</div><div class="muted">${esc(p.title)}${p.code ? ' — کد ' + fa(p.code) : ''}</div>
    <div class="p-sig-img">${S.settings.signature ? `<img src="${S.settings.signature}" alt="">` : ''}</div>
    <div class="muted">تاریخ: ${fa(insp.date)}</div>
  </div>`;
}

function kv(rows) {
  return `<table class="p-kv">${rows.reduce((acc, r, i) => {
    if (i % 2 === 0) acc.push([]);
    acc[acc.length - 1].push(r); return acc;
  }, []).map(pair => `<tr>${pair.map(([k, v]) => `<th>${k}</th><td>${v}</td>`).join('')}${pair.length === 1 ? '<th></th><td></td>' : ''}</tr>`).join('')}</table>`;
}

function workplaceRows(insp) {
  const w = insp.workplace;
  return [
    ['نام کارگاه', esc(w.name)], ['کد کارگاه', dash(w.workshopCode)],
    ['کارفرما / مدیر', esc(w.employer)], ['کد ملی کارفرما', dash(w.employerNid)],
    ['نوع فعالیت', esc(w.activity) || '—'], ['تلفن', dash(w.phone)],
    ['تعداد کارگران', `مرد ${dash(w.workersMale)}، زن ${dash(w.workersFemale)}، زیر ۱۸ سال ${dash(w.workersUnder18)}`], ['نشانی', esc(w.address) || '—']
  ];
}

function renderReport(insp) {
  const st = stats(insp), fu = insp.type.kind === 'followup', labels = fu ? FU_STATE_LABEL : STATE_LABEL;
  const ac = insp.accident;
  const summary = [
    ['موارد بررسی‌شده', st.total], [fu ? 'رفع شده' : 'منطبق', st.c], [fu ? 'رفع نشده' : 'نامنطبق', st.nc],
    [fu ? 'موضوعیت ندارد' : 'غیرمرتبط', st.na], ['درصد انطباق', st.pct == null ? '—' : st.pct + '٪'], ['خطر قریب‌الوقوع', st.imminent]
  ];
  return `<div class="p-doc">
    ${letterhead({ no: serialOf(insp), date: insp.date, attach: insp.photos.length ? 'دارد' : 'ندارد' })}
    <h1 class="p-title">گزارش ${esc(insp.type.name)}${insp.rev ? ` <small>(نسخه اصلاحی ${fa(insp.rev)})</small>` : ''}</h1>
    <h2>مشخصات کارگاه و کارفرما</h2>${kv(workplaceRows(insp))}
    <h2>مشخصات بازرسی</h2>${kv([
      ['نوع بازرسی', esc(insp.type.name)], ['تاریخ و ساعت', `${fa(insp.date)} ${insp.time ? '، ساعت ' + fa(insp.time) : ''}`],
      ['مبنای بازرسی', esc(insp.reason) || '—'], ['نماینده کارفرما', esc(insp.presentRep) || '—'],
      ['بازرس', esc(S.settings.profile.name)], ...(insp.followupOf ? [['عطف به ابلاغیه', ltr(insp.followupOf.serial)]] : [])
    ])}
    <h2>خلاصه نتایج</h2>
    <div class="p-sum">${summary.map(([k, v]) => `<div><b>${fa(v)}</b><span>${k}</span></div>`).join('')}</div>
    ${ac ? accidentReport(ac) : ''}
    ${insp.type.sections.map(sec => `<h2>${esc(sec.title)}</h2>
      <table class="p-tbl"><thead><tr><th class="c-n">ردیف</th><th>موضوع</th><th class="c-s">وضعیت</th><th class="c-r">سطح خطر</th><th>توضیحات / اقدام اصلاحی</th></tr></thead><tbody>
      ${sec.items.map((it, i) => {
        const a = insp.answers[it.id] || {};
        const notes = [a.note && esc(a.note), a.s === 'NC' && a.action && `<b>اقدام اصلاحی:</b> ${esc(a.action)}`, a.s === 'NC' && (a.risk === 'X' ? '<b>مهلت:</b> فوری' : a.days && `<b>مهلت:</b> ${fa(a.days)} روز`)].filter(Boolean).join('<br>');
        return `<tr class="${a.s === 'NC' ? (a.risk === 'X' ? 'r-x' : 'r-nc') : ''}"><td class="c-n">${fa(i + 1)}</td><td>${esc(it.text)}${it.ref ? `<div class="p-ref">${esc(it.ref)}</div>` : ''}</td>
          <td class="c-s">${labels[a.s] || '—'}</td><td class="c-r">${a.s === 'NC' ? RISK_LABEL[a.risk] || '—' : ''}</td><td>${notes}</td></tr>`;
      }).join('')}</tbody></table>`).join('')}
    <h2>جمع‌بندی و نظر بازرس</h2><div class="p-para">${esc(insp.conclusion) || '—'}</div>
    ${deliveryReport(insp)}
    ${signature(insp)}
    ${insp.photos.length ? `<div class="p-photos-page"><h2>پیوست: تصاویر</h2><div class="p-photos">${insp.photos.map((p, i) =>
      `<figure><img src="${S.photoCache[p.id] || ''}" alt=""><figcaption>${fa(i + 1)}. ${esc(p.caption)}</figcaption></figure>`).join('')}</div></div>` : ''}
    ${S.settings.letterhead.footer ? `<div class="p-foot">${esc(S.settings.letterhead.footer)}</div>` : ''}
  </div>`;
}

function accidentReport(ac) {
  return `<h2>مشخصات حادثه</h2>
    ${kv([['تاریخ و ساعت حادثه', `${fa(ac.date)} ${ac.time ? '، ساعت ' + fa(ac.time) : ''}`], ['محل وقوع', esc(ac.location) || '—'], ['نوع حادثه', esc(ac.accidentType) || '—']])}
    <h3>شرح حادثه</h3><div class="p-para">${esc(ac.description)}</div>
    <h3>مصدومان</h3>
    <table class="p-tbl"><thead><tr><th class="c-n">ردیف</th><th>نام</th><th>کد ملی</th><th>سن</th><th>جنسیت</th><th>شغل</th><th>سابقه</th><th>نوع آسیب / عضو</th><th>شدت</th></tr></thead><tbody>
    ${ac.victims.map((v, i) => `<tr class="${v.severity === 'فوت' ? 'r-x' : ''}"><td class="c-n">${fa(i + 1)}</td><td>${esc(v.name)}</td><td>${dash(v.nid)}</td><td>${dash(v.age)}</td><td>${esc(v.gender) || '—'}</td><td>${esc(v.job) || '—'}</td><td>${dash(v.experience)}</td><td>${esc([v.injury, v.bodyPart].filter(Boolean).join(' / ')) || '—'}</td><td>${esc(v.severity)}</td></tr>`).join('')}
    </tbody></table>
    ${ac.witnesses.length ? `<h3>اظهارات شاهدان</h3>${ac.witnesses.map(w => `<div class="p-para"><b>${esc(w.name)}:</b> ${esc(w.statement)}</div>`).join('')}` : ''}
    <h3>تحلیل علل</h3>
    ${kv([['علت مستقیم', esc(ac.directCause) || '—'], ['علل ریشه‌ای', esc(ac.rootCause) || '—'], ['قصور کارفرما', esc(ac.employerFault) || '—'], ['سهم قصور کارفرما', ac.faultPercent ? fa(ac.faultPercent) + '٪' : '—']])}
    ${ac.recommendations ? `<h3>توصیه‌ها</h3><div class="p-para">${esc(ac.recommendations)}</div>` : ''}`;
}

function deliveryReport(insp) {
  const d = insp.delivery;
  if (!d || (!d.name && !d.signature)) return '<h2>ابلاغ در محل</h2><div class="p-para">ابلاغ در محل انجام نشده است.</div>';
  return `<h2>ابلاغ در محل</h2>
    <div class="p-deliv">${kv([['نام ابلاغ‌شونده', esc(d.name) || '—'], ['سمت', esc(d.role) || '—'], ['کد ملی', dash(d.nid)], ['تاریخ و ساعت ابلاغ', `${dash(d.date)}${d.time ? '، ساعت ' + fa(d.time) : ''}`]])}
    <div class="p-rsig"><div class="muted">امضای ابلاغ‌شونده</div>${d.signature ? `<img src="${d.signature}" alt="">` : '<div class="muted">امضا نشده</div>'}</div></div>`;

function ackBox(insp) {

      <p>اینجانب <b>${esc(d.name)}</b> به سمت <b>${esc(d.role)}</b>${d.nid ? ` به کد ملی ${fa(d.nid)}` : ''} این ابلاغیه را در تاریخ ${fa(d.date)}${d.time ? ' ساعت ' + fa(d.time) : ''} در محل کارگاه دریافت نمودم.</p>
      <div class="p-ack-sign"><img src="${d.signature}" alt=""><div>امضای ابلاغ‌شونده</div></div></div>`;
  }
  return `<div class="p-ack"><div class="p-ack-h">رسید ابلاغ</div>
      <p>اینجانب .................................................... به سمت .............................. این ابلاغیه را در تاریخ ......../......../............ دریافت نمودم.</p>
      <div class="p-ack-sign">امضا و مهر کارگاه</div></div>`;
}

function renderNotice(insp) {
  const st = stats(insp), w = insp.workplace, P = S.pkg;
  const imminent = st.ncItems.filter(x => x.a.risk === 'X'), others = st.ncItems.filter(x => x.a.risk !== 'X');
  const intro = esc(P.noticeIntro).replace(/\{date\}/g, fa(insp.date)).replace(/\{workplace\}/g, esc(w.name)).replace(/\{employer\}/g, esc(w.employer));
  const row = ({ item, a }, n, imm) => `<tr><td class="c-n">${fa(n)}</td><td>${esc(item.text)}${item.ref ? `<div class="p-ref">${esc(item.ref)}</div>` : ''}</td><td>${esc(a.action)}</td>
    ${imm ? '' : `<td class="c-r">${RISK_LABEL[a.risk] || '—'}</td><td class="c-s">${fa(a.days)} روز</td><td class="c-s">${fa(Jalali.addDays(insp.date, a.days))}</td>`}</tr>`;

    <div class="p-to">
      <div><b>کارفرما / مدیر محترم:</b> ${esc(w.employer)}</div>
      <div><b>کارگاه:</b> ${esc(w.name)}${w.workshopCode ? ` — کد کارگاه ${fa(w.workshopCode)}` : ''}</div>
      ${w.address ? `<div><b>نشانی:</b> ${esc(w.address)}</div>` : ''}
      <div><b>موضوع:</b> ابلاغ نواقص و تعیین مهلت رفع${insp.followupOf ? ` (عطف به ابلاغیه شماره ${ltr(insp.followupOf.serial)})` : ''}</div>
    </div>
    <p>با سلام؛</p>
    <p class="p-para">${intro}</p>
    ${imminent.length ? `<div class="p-imm"><div class="p-imm-h">خطر قریب‌الوقوع — اقدام فوری</div><p>${esc(P.noticeImminent)}</p>
      <table class="p-tbl"><thead><tr><th class="c-n">ردیف</th><th>شرح خطر</th><th>اقدام لازم</th></tr></thead><tbody>${imminent.map((x, i) => row(x, i + 1, true)).join('')}</tbody></table></div>` : ''}

      ${others.map((x, i) => row(x, imminent.length + i + 1, false)).join('')}</tbody></table>` : ''}
    <p class="p-para">${esc(P.noticeOutro)}</p>
    <div class="p-sigrow">${ackBox(insp)}${signature(insp)}</div>

  </div>`;
}

async function printInspection(insp, kind) {
  for (const p of insp.photos) if (!S.photoCache[p.id]) S.photoCache[p.id] = (await DB.get('photos', p.id))?.data;
  await printDoc(kind === 'report' ? renderReport(insp) : renderNotice(insp), `${kind === 'report' ? 'گزارش' : 'ابلاغیه'}-${serialOf(insp)}`);
}

async function printDoc(html, title) {
  const box = $('#print');
  box.innerHTML = html;
  await Promise.all([...box.querySelectorAll('img')].map(img => img.decode ? img.decode().catch(() => {}) : null));
  if (document.fonts?.ready) await document.fonts.ready;
  const old = document.title;
  document.title = title;
  const restore = () => { document.title = old; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
}

// ---------- Backup, Excel export, checklist package ----------
const fileDate = () => Jalali.today().replace(/\//g, '-');

async function exportBackup() {
  flushAll();
  const data = {
    kind: 'inspection-checklist-backup', app: APP_VERSION, exportedAt: new Date().toISOString(),
    settings: S.settings, package: S.pkg, workplaces: S.workplaces, inspections: S.inspections,
    photos: await DB.all('photos')
  };
  downloadBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), `backup-${S.settings.profile.code || 'inspector'}-${fileDate()}.json`);
  S.settings.lastBackup = new Date().toISOString(); saveSettings();
  toast('فایل پشتیبان دریافت شد');
  if (S.view === 'home' || S.view === 'settings') render();
}

async function importBackup() {
  const [f] = await pickFile('.json,application/json');
  if (!f) return;
  let data;
  try { data = JSON.parse(await readFileAsText(f)); } catch { return modal('خطا', 'فایل قابل خواندن نیست.'); }
  if (data.kind !== 'inspection-checklist-backup') return modal('خطا', 'این فایل، پشتیبان این برنامه نیست.');
  const ok = await confirmBox('بازیابی پشتیبان', `${faDigits(data.inspections.length)} بازرسی و ${faDigits(data.workplaces.length)} کارگاه به اطلاعات فعلی افزوده یا جایگزین می‌شود (بازرسی‌های هم‌شناسه بازنویسی می‌شوند). ادامه می‌دهید؟`, 'بازیابی');
  if (!ok) return;
  for (const x of data.workplaces) await DB.put('workplaces', x);
  for (const x of data.inspections) await DB.put('inspections', x);
  for (const x of data.photos || []) await DB.put('photos', x);
  // Profile, letterhead and checklists are restored only onto an unconfigured device.
  if (!S.settings.profile.code) {
    S.settings = Object.assign(DEFAULT_SETTINGS(), data.settings);
    if (data.package) await DB.put('kv', { ...data.package, id: 'package' });
  } else {
    for (const [y, n] of Object.entries(data.settings?.seq || {})) S.settings.seq[y] = Math.max(S.settings.seq[y] || 0, n);
  }
  await DB.put('kv', S.settings);
  await loadAll();
  toast('بازیابی انجام شد'); go('home');
}

function exportExcel() {
  const finalOrAll = S.inspections.slice().sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  // Follow-up status of each non-compliant item, from later follow-up inspections that reference it.
  const fuStatus = {};
  finalOrAll.filter(i => i.followupOf && i.status === 'final').forEach(i => {
    Object.entries(i.answers).forEach(([k, a]) => {
      if (k.startsWith('fu_') && a.s) fuStatus[i.followupOf.id + ':' + k.slice(3)] = a.s === 'C' ? 'رفع شده' : a.s === 'NC' ? 'رفع نشده' : 'موضوعیت ندارد';
    });
  });
  const sevRank = (v) => SEVERITIES.indexOf(v);
  const s1 = [['شماره', 'تاریخ', 'نوع بازرسی', 'وضعیت', 'کارگاه', 'کد کارگاه', 'کارفرما', 'نوع فعالیت', 'تعداد کارگران', 'منطبق', 'نامنطبق', 'غیرمرتبط', 'درصد انطباق', 'خطر قریب‌الوقوع', 'تعداد مصدومان', 'بیشترین شدت آسیب', 'عطف به', 'ابلاغ در محل', 'ابلاغ‌شونده']];
  const s2 = [['شماره', 'تاریخ', 'کارگاه', 'کارفرما', 'بخش', 'موضوع', 'سطح خطر', 'اقدام اصلاحی', 'مهلت (روز)', 'تا تاریخ', 'وضعیت پیگیری']];
  finalOrAll.forEach(i => {
    const st = stats(i), w = i.workplace, ac = i.accident;
    const workers = ['workersMale', 'workersFemale'].reduce((a, k) => a + (+w[k] || 0), 0);
    const worst = ac ? ac.victims.map(v => v.severity).filter(Boolean).sort((a, b) => sevRank(b) - sevRank(a))[0] || '' : '';
    s1.push([serialOf(i), i.date, i.type.name, i.status === 'final' ? 'نهایی' : 'پیش‌نویس', w.name, w.workshopCode, w.employer, w.activity, workers,
      st.c, st.nc, st.na, st.pct ?? '', st.imminent, ac ? ac.victims.length : '', worst, i.followupOf?.serial || '',
      i.delivery?.signature ? 'بله' : 'خیر', i.delivery?.signature ? `${i.delivery.name} (${i.delivery.role})` : '']);
    st.ncItems.forEach(({ sec, item, a }) => {
      const origId = item.id.startsWith('fu_') ? item.id.slice(3) : item.id;
      s2.push([serialOf(i), i.date, w.name, w.employer, sec.title, item.text, RISK_LABEL[a.risk] || '', a.action || '',
        a.risk === 'X' ? 'فوری' : (+a.days || ''), a.risk === 'X' ? '' : Jalali.addDays(i.date, a.days),
        fuStatus[i.id + ':' + item.id] || fuStatus[i.id + ':' + origId] || 'در انتظار پیگیری']);
    });
  });
  downloadBlob(XLSX.build([{ name: 'بازرسی‌ها', rows: s1 }, { name: 'نواقص', rows: s2 }]), `inspections-${fileDate()}.xlsx`);
  toast('فایل اکسل دریافت شد');
}

function exportPackage() {
  flushAll();
  const pkg = clone(S.pkg); delete pkg.id;
  pkg.updatedAt = new Date().toISOString();
  S.pkg.updatedAt = pkg.updatedAt; savePkg();
  downloadBlob(new Blob([JSON.stringify(pkg, null, 1)], { type: 'application/json' }), `checklist-package-v${pkg.version}.json`);
  toast('بسته چک‌لیست دریافت شد');
}

async function importPackage() {
  const [f] = await pickFile('.json,application/json');
  if (!f) return;
  let pkg;
  try { pkg = JSON.parse(await readFileAsText(f)); } catch { return modal('خطا', 'فایل قابل خواندن نیست.'); }
  if (pkg.kind !== 'inspection-checklist-package' || !Array.isArray(pkg.types)) return modal('خطا', 'این فایل، بسته چک‌لیست این برنامه نیست.');

  await DB.put('kv', { ...pkg, id: 'package' });

function monthsWithData() {

function exportRecord(i, photos) {
  const st = stats(i);
  return {
    id: i.id, serial: i.serial, rev: i.rev || 0, serialLabel: serialOf(i),
    type: { id: i.type.id, name: i.type.name, kind: i.type.kind },
    date: Jalali.norm(i.date), time: i.time || '', reason: i.reason || '', presentRep: i.presentRep || '',
    createdAt: i.createdAt, finalizedAt: i.finalizedAt || null,
    followupOf: i.followupOf || null,
    workplace: i.workplace,
    summary: { total: st.total, compliant: st.c, nonCompliant: st.nc, notApplicable: st.na, compliancePct: st.pct, imminent: st.imminent },
    items: i.type.sections.flatMap(sec => sec.items.map((it, k) => {
      const a = i.answers[it.id] || {}, nc = a.s === 'NC';
      return {
        sectionId: sec.id, section: sec.title, no: k + 1, itemId: it.id, text: it.text, ref: it.ref || '',
        status: a.s || null, risk: nc ? a.risk || null : null, action: nc ? a.action || '' : '',
        days: nc && a.risk !== 'X' ? (+a.days || null) : null,
        due: nc ? (a.risk === 'X' ? Jalali.norm(i.date) : Jalali.addDays(i.date, a.days)) : null,
        note: a.note || ''
      };
    })),
    accident: i.accident || null,
    conclusion: i.conclusion || '',
    delivery: i.delivery && (i.delivery.name || i.delivery.signature) ? i.delivery : null,
    photos: i.photos.map(p => photos ? { caption: p.caption || '', data: photos[p.id] || null } : { caption: p.caption || '' })

async function exportMonthly(key, withPhotos) {

// ---------- Dashboard: inspector's performance ----------
const JMONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const PERIODS = [['month', 'ماه جاری'], ['q', 'سه ماه اخیر'], ['year', 'سال جاری'], ['all', 'همه زمان‌ها']];

function periodStart(p) {
  const today = Jalali.today(), [y, m] = today.split('/');
  return { month: `${y}/${m}/01`, q: Jalali.addDays(today, -90), year: `${y}/01/01`, all: '' }[p];
}

function dashData(period) {
  const from = periodStart(period), today = Jalali.today();
  const inPeriod = (i) => Jalali.norm(i.date) >= from;
  const fin = S.inspections.filter(i => i.status === 'final' && inPeriod(i));
  const drafts = S.inspections.filter(i => i.status === 'draft');
  const sts = fin.map(i => [i, stats(i)]);

  const wpLatest = {};
  fin.forEach(i => { const k = i.workplace.wpId; if (!wpLatest[k] || Jalali.norm(i.date) > Jalali.norm(wpLatest[k].date)) wpLatest[k] = i; });
  const workers = Object.values(wpLatest).reduce((a, i) => a + (+i.workplace.workersMale || 0) + (+i.workplace.workersFemale || 0), 0);

  const pcts = sts.filter(([i, st]) => i.type.kind !== 'followup' && st.pct != null).map(([, st]) => st.pct);
  const byType = {};
  fin.forEach(i => { byType[i.type.name] = (byType[i.type.name] || 0) + 1; });

  const bySection = {};
  sts.filter(([i]) => i.type.kind !== 'followup').forEach(([, st]) => st.ncItems.forEach(({ sec }) => { bySection[sec.title] = (bySection[sec.title] || 0) + 1; }));

  const acc = fin.filter(i => i.accident);
  const sev = Object.fromEntries(SEVERITIES.map(s => [s, 0]));
  acc.forEach(i => i.accident.victims.forEach(v => { if (v.severity in sev) sev[v.severity]++; }));

  let fuChecked = 0, fuFixed = 0;
  sts.filter(([i]) => i.type.kind === 'followup').forEach(([, st]) => { fuChecked += st.c + st.nc; fuFixed += st.c; });

  // Last 12 Jalali months, oldest first.
  const [ty, tm] = today.split('/').map(Number), months = [];
  for (let k = 11; k >= 0; k--) {
    let y = ty, m = tm - k; while (m < 1) { m += 12; y--; }
    const key = `${y}/${String(m).padStart(2, '0')}`;
    months.push({ key, label: JMONTHS[m - 1], year: y, n: S.inspections.filter(i => i.status === 'final' && Jalali.norm(i.date).startsWith(key)).length });
  }

  const followed = new Set(S.inspections.filter(i => i.followupOf && i.status === 'final').map(i => i.followupOf.id));
  const pending = S.inspections.filter(i => i.status === 'final' && !followed.has(i.id) && stats(i).nc > 0).map(i => {
    const st = stats(i);
    const due = st.ncItems.map(x => x.a.risk === 'X' ? Jalali.norm(i.date) : Jalali.addDays(i.date, x.a.days)).sort()[0];
    return { i, n: st.nc, imminent: st.imminent, due, overdue: due <= today };
  }).sort((a, b) => a.due.localeCompare(b.due));

  return {
    period, fin, drafts, workers, byType, bySection, acc, sev, months, pending,
    wpCount: Object.keys(wpLatest).length,
    notices: sts.filter(([, st]) => st.nc > 0).length,
    nc: sts.reduce((a, [, st]) => a + st.nc, 0),
    imminent: sts.reduce((a, [, st]) => a + st.imminent, 0),
    avgPct: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null,
    fuChecked, fuFixed
  };
}

  view: 'home', params: {}, admin: false, photoCache: {}, q: '', dashPeriod: 'year'
};

const DEFAULT_SETTINGS = () => ({
  id: 'settings',
  profile: { name: '', code: '', title: 'بازرس کار' },
  signature: null, logo: null,
  letterhead: { line1: 'جمهوری اسلامی ایران', line2: 'وزارت تعاون، کار و رفاه اجتماعی', line3: 'اداره کل تعاون، کار و رفاه اجتماعی استان ...', footer: '' },
  seq: {}, lastBackup: null, exports: {}
});

// ---------- Small helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const clone = (o) => JSON.parse(JSON.stringify(o));
const ltr = (s) => `<span dir="ltr" class="ltr">${esc(faDigits(s))}</span>`;
const serialOf = (i) => i.serial + (i.rev ? '-R' + i.rev : '');

function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const ks = path.split('.');
  let cur = o;
  ks.slice(0, -1).forEach((k, i) => {
    if (cur[k] == null) cur[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    cur = cur[k];
  });
  cur[ks[ks.length - 1]] = v;
}

const timers = {};
function debounce(key, fn, ms = 400) { clearTimeout(timers[key]); timers[key] = setTimeout(() => { delete timers[key]; fn(); }, ms); timers[key + ':fn'] = fn; }
function flushAll() { Object.keys(timers).filter(k => !k.endsWith(':fn') && timers[k]).forEach(k => { clearTimeout(timers[k]); delete timers[k]; timers[k + ':fn'](); }); }

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function modal(title, html, buttons = [['بستن', null]]) {
  return new Promise(resolve => {
    const m = document.createElement('div'); m.className = 'modal-bg';
    m.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><div class="modal-body">${html}</div><div class="modal-btns">${buttons.map(([l, v], i) => `<button class="btn ${i === buttons.length - 1 ? 'primary' : ''}" data-i="${i}">${esc(l)}</button>`).join('')}</div></div>`;
    m.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { m.remove(); resolve(buttons[+b.dataset.i][1]); } });
    document.body.appendChild(m);
  });
}
const confirmBox = (title, html, okLabel = 'تأیید') => modal(title, html, [['انصراف', false], [okLabel, true]]);

// ---------- Persistence ----------
const saveSettings = () => debounce('settings', () => DB.put('kv', S.settings));
const savePkg = () => debounce('pkg', () => DB.put('kv', { ...S.pkg, id: 'package' }));
const saveInsp = (insp) => debounce('insp:' + insp.id, () => DB.put('inspections', insp));

async function loadAll() {
  S.settings = Object.assign(DEFAULT_SETTINGS(), await DB.get('kv', 'settings'));
  const pkg = await DB.get('kv', 'package');
  S.pkg = pkg || clone(DEFAULT_PACKAGE);
  S.inspections = (await DB.all('inspections')).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  S.workplaces = (await DB.all('workplaces')).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fa'));
}

// ---------- Domain ----------
function stats(insp) {
  let c = 0, nc = 0, na = 0, total = 0, imminent = 0;
  const ncItems = [];
  insp.type.sections.forEach(sec => sec.items.forEach(item => {
    total++;
    const a = insp.answers[item.id] || {};
    if (a.s === 'C') c++;
    else if (a.s === 'NA') na++;
    else if (a.s === 'NC') { nc++; if (a.risk === 'X') imminent++; ncItems.push({ sec, item, a }); }
  }));
  const pct = c + nc ? Math.round((c / (c + nc)) * 100) : null;
  return { c, nc, na, total, answered: c + nc + na, pct, imminent, ncItems };
}

function nextSerial() {
  const y = Jalali.year();
  S.settings.seq[y] = (S.settings.seq[y] || 0) + 1;
  saveSettings();
  return `${S.settings.profile.code}-${y}-${String(S.settings.seq[y]).padStart(4, '0')}`;
}

function wpSnapshot(wp) {
  const o = { wpId: wp?.id || uid() };
  WP_FIELDS.forEach(([k]) => { o[k] = wp?.[k] || ''; });
  return o;
}

async function createInspection(typeId, wpId, prevId) {
  const t = S.pkg.types.find(x => x.id === typeId);
  const prev = prevId && S.inspections.find(x => x.id === prevId);
  const type = clone({ id: t.id, name: t.name, kind: t.kind, sections: t.sections });
  if (t.kind === 'followup') {
    type.sections = [{
      id: 'fu', title: `پیگیری موارد ابلاغیه شماره ${serialOf(prev)}`,
      items: stats(prev).ncItems.map(({ item, a }) => ({ id: 'fu_' + item.id, text: item.text, ref: item.ref, prevAction: a.action || '', prevRisk: a.risk || '' }))
    }];
  }
  const wp = prev ? prev.workplace : wpSnapshot(S.workplaces.find(w => w.id === wpId));
  const insp = {
    id: uid(), serial: nextSerial(), rev: 0, status: 'draft', type,
    createdAt: new Date().toISOString(), date: Jalali.today(), time: '', reason: prev ? REASONS[4] : '', presentRep: '',
    workplace: clone(wp), answers: {}, conclusion: '', photos: [], history: [],
    accident: t.kind === 'accident' ? { date: Jalali.today(), time: '', location: '', description: '', victims: [{}], witnesses: [], directCause: '', rootCause: '', employerFault: '', faultPercent: '', recommendations: '' } : null,
    followupOf: prev ? { id: prev.id, serial: serialOf(prev) } : null
  };
  S.inspections.unshift(insp);
  await DB.put('inspections', insp);
  return insp;
}

async function upsertWorkplaceFrom(insp) {
  const w = insp.workplace;
  const rec = { id: w.wpId };
  WP_FIELDS.forEach(([k]) => { rec[k] = w[k] || ''; });
  rec.updatedAt = new Date().toISOString();
  await DB.put('workplaces', rec);
  const i = S.workplaces.findIndex(x => x.id === rec.id);
  if (i >= 0) S.workplaces[i] = rec; else S.workplaces.push(rec);
}

// ---------- Rendering ----------
function go(view, params = {}) { flushAll(); S.view = view; S.params = params; pushNav(); render(); window.scrollTo(0, 0); }
// Each screen and step is a history entry, so the phone's Back button walks back through them.
function pushNav(replace) {
  const st = { view: S.view, params: clone(S.params) };
  try { history[replace ? 'replaceState' : 'pushState'](st, ''); } catch (e) { /* history unavailable */ }
}
window.addEventListener('popstate', e => {
  if (S.closeSign) { S.closeSign(null, true); return; }
  if (!e.state || !e.state.view) return;
  flushAll(); S.view = e.state.view; S.params = e.state.params; render(); window.scrollTo(0, 0);
});

function render() {
  const views = { dash: viewDash, home: viewHome, new: viewNew, edit: viewEdit, workplaces: viewWorkplaces, wpEdit: viewWpEdit, settings: viewSettings, admin: viewAdmin, adminType: viewAdminType };
  const nav = [['dash', 'داشبورد'], ['home', 'بازرسی‌ها'], ['workplaces', 'کارگاه‌ها'], ['settings', 'تنظیمات']];
  const active = { new: 'home', edit: 'home', wpEdit: 'workplaces', admin: 'settings', adminType: 'settings' }[S.view] || S.view;
  $('#app').innerHTML = `
    <header class="top"><div class="top-in">
      <div class="brand">چک‌لیست بازرسی کار</div>
      <nav>${nav.map(([v, l]) => `<button class="nav-b ${active === v ? 'on' : ''}" data-act="go" data-v="${v}">${l}</button>`).join('')}</nav>
    </div></header>
    <main class="wrap">${views[S.view]()}</main>`;
  afterRender();
}

function afterRender() {


}

const field = (label, attrs, value, kind) => kind === 'area'
  ? `<label class="fld"><span>${label}</span><textarea ${attrs} rows="2">${esc(value)}</textarea></label>`
  : `<label class="fld"><span>${label}</span><input ${attrs} ${kind === 'num' ? 'inputmode="numeric" data-num' : kind === 'digits' ? 'data-num' : ''} value="${esc(kind ? faDigits(value) : value)}"></label>`;

// Full-screen signature pad. Resolves with a PNG data URL, or null when cancelled.
function signFullscreen(title) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'sign-fs';
    m.innerHTML = `<div class="sign-fs-head"><b>${esc(title)}</b><span>با انگشت داخل کادر امضا کنید</span></div>
      <div class="sign-fs-area"><canvas></canvas><div class="sign-fs-line"></div></div>
      <div class="sign-fs-btns"><button class="btn" data-k="cancel">انصراف</button><button class="btn" data-k="clear">امضای مجدد</button><button class="btn primary" data-k="save">ذخیره</button></div>`;
    document.body.appendChild(m);
    document.body.classList.add('no-scroll');
    let pad;
    // A fresh canvas per size, so rotating the phone before signing gives a correctly scaled pad.
    const mount = () => {
      const old = m.querySelector('canvas'), c = document.createElement('canvas');
      old.replaceWith(c); pad = attachSignaturePad(c, 3.2);
    };
    requestAnimationFrame(mount);
    const onResize = () => { if (!pad || pad.isEmpty()) mount(); };
    window.addEventListener('resize', onResize);
    history.pushState({ sign: true }, '');
    const close = (val, fromPop) => {
      S.closeSign = null;
      window.removeEventListener('resize', onResize);
      document.body.classList.remove('no-scroll');
      m.remove();
      if (!fromPop) history.back();
      resolve(val);
    };
    S.closeSign = close;
    m.addEventListener('click', e => {
      const k = e.target.closest('[data-k]')?.dataset.k;
      if (k === 'clear') pad.clear();
      else if (k === 'cancel') close(null);
      else if (k === 'save') {
        const d = pad.toDataURL();
        if (!d) return toast('ابتدا داخل کادر امضا کنید');
        close(d);
      }
    });
  });
}

// ----- Home -----
function viewHome() {
  const p = S.settings.profile;
  const banners = [];
  if (DB.backend === 'memory') banners.push(`<div class="banner err"><b>هشدار:</b> مرورگر اجازه ذخیره‌سازی نمی‌دهد و اطلاعات با بستن صفحه از بین می‌رود. فایل را با Chrome از مسیر «Downloads» باز کنید، یا پس از هر بازرسی حتماً PDF و پشتیبان بگیرید.</div>`);
  else if (DB.backend === 'localstorage') banners.push(`<div class="banner warn">فضای ذخیره‌سازی این مرورگر محدود است؛ تعداد زیاد تصویر ممکن است ذخیره نشود. پشتیبان‌گیری منظم را فراموش نکنید.</div>`);
  if (!p.name || !p.code || !S.settings.signature) banners.push(`<div class="banner warn">مشخصات بازرس، کد بازرس یا امضا تکمیل نشده است. <button class="btn sm" data-act="go" data-v="settings">تکمیل در تنظیمات</button></div>`);
  const last = S.settings.lastBackup ? new Date(S.settings.lastBackup) : null;
  if (S.inspections.length && (!last || (Date.now() - last) / 864e5 > BACKUP_DAYS))
    banners.push(`<div class="banner warn">اطلاعات فقط روی همین دستگاه ذخیره است. ${last ? `آخرین پشتیبان: ${faDigits(Jalali.fromDate(last))}` : 'هنوز پشتیبان گرفته نشده.'} <button class="btn sm" data-act="backup">پشتیبان‌گیری</button></div>`);
  return `${banners.join('')}
    <div class="row-between"><h2>بازرسی‌ها</h2><button class="btn primary" data-act="go" data-v="new">+ بازرسی جدید</button></div>
    <input class="search" placeholder="جستجو: نام کارگاه، کارفرما یا شماره" data-act-input="search" value="${esc(S.q)}">
    <div id="list">${listHtml()}</div>`;
}
function listHtml() {
  const q = enDigits(S.q).trim();
  const rows = S.inspections.filter(i => !q || [i.workplace.name, i.workplace.employer, serialOf(i)].some(s => (s || '').includes(q)));
  if (!rows.length) return `<div class="empty">${S.inspections.length ? 'موردی یافت نشد.' : 'هنوز بازرسی‌ای ثبت نشده است.'}</div>`;
  return rows.map(i => {
    const st = stats(i);
    return `<button class="card list-item" data-act="open" data-id="${i.id}">
      <div class="li-top"><b>${esc(i.workplace.name || 'کارگاه بدون نام')}</b><span class="badge ${i.status}">${i.status === 'final' ? 'نهایی' : 'پیش‌نویس'}</span></div>
      <div class="li-meta">${ltr(serialOf(i))}<i class="sep"></i>${esc(i.type.name)}<i class="sep"></i>${esc(faDigits(i.date))}</div>
      <div class="li-meta">${faDigits(st.answered)} از ${faDigits(st.total)} پاسخ<i class="sep"></i>${st.nc ? `<span class="t-nc">${faDigits(st.nc)} نامنطبق</span>` : 'بدون نقص'}${st.imminent ? `<i class="sep"></i><span class="t-x">${faDigits(st.imminent)} خطر قریب‌الوقوع</span>` : ''}</div>
    </button>`;
  }).join('');
}

// ----- New inspection -----
function viewNew() {
  const { typeId, wpId, prevId } = S.params;
  const t = S.pkg.types.find(x => x.id === typeId);
  let html = `<h2>بازرسی جدید</h2><div class="card"><h3>۱. نوع بازرسی</h3><div class="choices">${S.pkg.types.map(x =>
    `<button class="choice ${typeId === x.id ? 'on' : ''}" data-act="newType" data-v="${x.id}"><b>${esc(x.name)}</b><small>${KIND_LABEL[x.kind]}</small></button>`).join('')}</div></div>`;

      `<button class="choice ${prevId === i.id ? 'on' : ''}" data-act="newPrev" data-v="${i.id}"><b>${esc(i.workplace.name)}</b><small>${ltr(serialOf(i))}<i class="sep"></i>${esc(faDigits(i.date))}<i class="sep"></i>${faDigits(stats(i).nc)} نقص</small></button>`).join('')}</div>`
      : '<div class="empty">بازرسی نهایی‌شده‌ای با نقص برای پیگیری وجود ندارد.</div>'}</div>`;

    <p class="hint">برای کارگاه جدید، مشخصات را در فرم بازرسی وارد کنید؛ پس از نهایی‌سازی به فهرست کارگاه‌ها افزوده می‌شود.</p></div>
    <button class="btn primary block" data-act="create">شروع بازرسی</button>`;

// ----- Edit inspection (step-by-step) -----
function curInsp() { return S.inspections.find(i => i.id === S.params.id); }

function stepsOf(insp) {
  const s = [{ key: 'info', title: 'اطلاعات بازرسی' }, { key: 'wp', title: 'مشخصات کارگاه و کارفرما' }];
  if (insp.accident) s.push({ key: 'acc', title: 'شرح حادثه' }, { key: 'victims', title: 'مصدومان' }, { key: 'causes', title: 'شاهدان و تحلیل علل' });
  insp.type.sections.forEach(sec => s.push({ key: 'sec:' + sec.id, title: sec.title, sec }));
  s.push({ key: 'photos', title: 'تصاویر' }, { key: 'concl', title: 'جمع‌بندی بازرس' }, { key: 'deliver', title: 'ابلاغ در محل' },
    { key: 'final', title: insp.status === 'final' ? 'گزارش و ابلاغیه' : 'بررسی و نهایی‌سازی' });
  return s;
}

// Missing/invalid fields, each tagged with the step that owns it.
function issuesOf(insp) {
  const out = [], add = (step, msg) => out.push({ step, msg });
  if (!Jalali.valid(insp.date)) add('info', 'تاریخ بازرسی نامعتبر است (نمونه: ۱۴۰۵/۰۸/۰۹).');
  if (!insp.reason) add('info', 'مبنای بازرسی انتخاب نشده.');
  if (!insp.workplace.name) add('wp', 'نام کارگاه وارد نشده.');
  if (!insp.workplace.employer) add('wp', 'نام کارفرما / مدیر وارد نشده.');
  if (insp.accident) {
    const ac = insp.accident;
    if (!Jalali.valid(ac.date)) add('acc', 'تاریخ حادثه نامعتبر است.');
    if (!ac.description) add('acc', 'شرح حادثه نوشته نشده.');
    if (!ac.victims.length) add('victims', 'دست‌کم یک مصدوم باید ثبت شود.');
    ac.victims.forEach((v, i) => {
      if (!v.name) add('victims', `نام مصدوم ${faDigits(i + 1)} وارد نشده.`);
      if (!v.severity) add('victims', `شدت آسیب مصدوم ${faDigits(i + 1)} انتخاب نشده.`);
    });
  }
  const d = insp.delivery || {};
  if (d.signature && !d.name) add('deliver', 'نام شخص ابلاغ‌شونده وارد نشده.');
  if (d.signature && !d.role) add('deliver', 'سمت شخص ابلاغ‌شونده انتخاب نشده.');
  if (d.date && !Jalali.valid(d.date)) add('deliver', 'تاریخ ابلاغ نامعتبر است.');
  insp.type.sections.forEach(sec => sec.items.forEach((item, i) => {
    const a = insp.answers[item.id] || {}, k = 'sec:' + sec.id, where = `ردیف ${faDigits(i + 1)}`;
    if (!a.s) add(k, `${where}: وضعیت انتخاب نشده.`);
    else if (a.s === 'NC') {
      if (!a.risk) add(k, `${where}: سطح خطر انتخاب نشده.`);
      if (!a.action) add(k, `${where}: اقدام اصلاحی نوشته نشده.`);
      if (a.risk !== 'X' && !(+a.days > 0)) add(k, `${where}: مهلت رفع تعیین نشده.`);
    }
  }));
  return out;
}
const validate = (insp) => issuesOf(insp).map(x => x.msg);

function stepIndex(insp) {
  const n = stepsOf(insp).length;
  const i = S.params.step != null ? S.params.step : insp.status === 'final' ? n - 1 : (insp.step || 0);
  return Math.min(Math.max(i, 0), n - 1);
}

function stepperHtml(insp, steps, cur, issues) {
  const cnt = (k) => issues.filter(x => x.step === k).length;
  const pct = Math.round(((cur + 1) / steps.length) * 100);
  return `<div class="stepper" id="stepper">
    <div class="row-between"><b>مرحله ${faDigits(cur + 1)} از ${faDigits(steps.length)}</b><span class="prog">${esc(steps[cur].title)}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <label class="fld"><span>رفتن به مرحله</span><select data-step-jump>${steps.map((s, i) => {
      const n = s.key === 'final' ? 0 : cnt(s.key);
      return `<option value="${i}" ${i === cur ? 'selected' : ''}>${faDigits(i + 1)}. ${esc(s.title)}${n ? ` — ${faDigits(n)} ناقص` : s.key !== 'final' ? ' ✓' : ''}</option>`;
    }).join('')}</select></label>
  </div>`;
}

function viewEdit() {
  const insp = curInsp();
  if (!insp) return '<div class="empty">بازرسی یافت نشد.</div>';
  const ro = insp.status === 'final', steps = stepsOf(insp), cur = stepIndex(insp), step = steps[cur];
  const issues = issuesOf(insp);
  const head = `<div class="card head"><div class="row-between">
    <div><h2>${esc(insp.type.name)}</h2><div class="li-meta">${ltr(serialOf(insp))}<i class="sep"></i>${esc(insp.workplace.name || 'کارگاه بدون نام')}</div></div>
    <span class="badge ${insp.status}">${ro ? 'نهایی' : 'پیش‌نویس'}</span></div>
    ${stepperHtml(insp, steps, cur, issues)}</div>`;

  let body;
  if (step.key === 'final') body = finalStepHtml(insp, steps, issues);
  else body = `<fieldset ${ro ? 'disabled' : ''} class="form">${stepBody(insp, step)}</fieldset>`;

  const nav = `<div class="step-nav">
    <button class="btn" data-act="stepPrev" ${cur === 0 ? 'disabled' : ''}>→ مرحله قبل</button>
    ${cur < steps.length - 1 ? `<button class="btn primary" data-act="stepNext">مرحله بعد ←</button>` : '<span></span>'}
  </div>`;
  return head + body + nav;
}

function stepBody(insp, step) {
  const w = insp.workplace;
  switch (step.key) {
    case 'info': {
      const reasons = insp.reason && !REASONS.includes(insp.reason) ? [...REASONS, insp.reason] : REASONS;
      return `<div class="card"><h3>اطلاعات بازرسی</h3><div class="grid">
        ${field('تاریخ بازرسی', 'data-f="date" placeholder="۱۴۰۵/۰۸/۰۹"', insp.date, 'digits')}
        ${field('ساعت', 'data-f="time" placeholder="۱۰:۳۰"', insp.time, 'digits')}
        ${selField('مبنای بازرسی', 'reason', insp.reason, reasons)}
        ${field('نماینده کارفرما حاضر در بازرسی', 'data-f="presentRep"', insp.presentRep)}
        ${insp.followupOf ? `<div class="fld"><span>عطف به ابلاغیه</span><div class="static">${ltr(insp.followupOf.serial)}</div></div>` : ''}
      </div></div>`;
    }
    case 'wp':
      return `<div class="card"><h3>مشخصات کارگاه و کارفرما</h3><p class="hint">مشخصات را با وضعیت فعلی کارگاه تطبیق دهید و در صورت نیاز اصلاح کنید.</p><div class="grid">
        ${WP_FIELDS.map(([k, l, kind]) => field(l, `data-f="workplace.${k}"`, w[k], kind)).join('')}</div></div>`;
    case 'acc': return accidentInfoHtml(insp);
    case 'victims': return victimsHtml(insp);
    case 'causes': return causesHtml(insp);
    case 'photos':
      return `<div class="card"><div class="row-between"><h3>تصاویر</h3>${insp.status === 'final' ? '' : '<button type="button" class="btn sm" data-act="addPhoto">+ افزودن تصویر</button>'}</div>
        <p class="hint">تصاویر در انتهای گزارش کامل چاپ می‌شوند.</p>
        <div class="photos">${insp.photos.map((p, i) => `<div class="ph-item">${S.photoCache[p.id] ? `<img src="${S.photoCache[p.id]}" alt="">` : '<div class="ph-ph">…</div>'}
          <input placeholder="شرح تصویر" data-f="photos.${i}.caption" value="${esc(p.caption)}">${insp.status === 'final' ? '' : `<button type="button" class="btn sm danger" data-act="rmPhoto" data-i="${i}">حذف</button>`}</div>`).join('') || '<div class="empty">تصویری افزوده نشده است.</div>'}</div></div>`;
    case 'concl':
      return `<div class="card"><h3>جمع‌بندی و نظر بازرس</h3><textarea class="concl" data-f="conclusion" placeholder="جمع‌بندی وضعیت کارگاه، مهم‌ترین نواقص و نظر بازرس">${esc(insp.conclusion)}</textarea></div>`;
    case 'deliver': return deliverHtml(insp);
    default: return sectionStepHtml(insp, step.sec);
  }
}

function sectionStepHtml(insp, sec) {
  const fu = insp.type.kind === 'followup';
  const bulk = insp.status === 'final' ? '' : `<div class="bulk">
      <button type="button" class="btn bulk-c" data-act="fillAll" data-sec="${sec.id}" data-v="C">✓ ${fu ? 'همه رفع شده' : 'همه منطبق'}</button>
      <button type="button" class="btn bulk-na" data-act="fillAll" data-sec="${sec.id}" data-v="NA">${fu ? 'همه موضوعیت ندارد' : 'همه غیرمرتبط'}</button>
    </div><p class="hint">موارد ${fu ? 'رفع نشده' : 'نامنطبق'} با این دکمه‌ها تغییر نمی‌کنند؛ پس از آن، موارد استثنا را جداگانه تغییر دهید.</p>`;
  return `<div class="card"><div class="row-between"><h3>${esc(sec.title)}</h3><span class="prog" id="pg-${sec.id}">${progSec(insp, sec)}</span></div>
    ${bulk}
    ${sec.items.map((it, i) => itemHtml(insp, it, i + 1)).join('')}
  </div>`;
}

function finalStepHtml(insp, steps, issues) {
  const st = stats(insp), ro = insp.status === 'final', fu = insp.type.kind === 'followup';
  const tiles = [['موارد', st.total], [fu ? 'رفع شده' : 'منطبق', st.c], [fu ? 'رفع نشده' : 'نامنطبق', st.nc],
    [fu ? 'موضوعیت ندارد' : 'غیرمرتبط', st.na], ['درصد انطباق', st.pct == null ? '—' : st.pct + '٪'], ['خطر قریب‌الوقوع', st.imminent]];
  const summary = `<div class="card"><h3>خلاصه نتایج</h3><div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><b>${faDigits(v)}</b><span>${k}</span></div>`).join('')}</div></div>`;
  if (ro) {
    return `${summary}<div class="card"><h3>دریافت خروجی</h3>
      <div class="out-btns">
        <button class="btn primary big" data-act="printReport">گزارش کامل بازرسی (PDF)</button>
        <button class="btn primary big" data-act="printNotice" ${st.nc ? '' : 'disabled'}>ابلاغیه نواقص به کارفرما (PDF)</button>
      </div>
      <p class="hint">در پنجره چاپ، گزینه «Save as PDF / ذخیره به‌صورت PDF» را انتخاب کنید.${st.nc ? '' : ' این بازرسی نقصی ندارد، بنابراین ابلاغیه صادر نمی‌شود.'}</p></div>
      <div class="card"><h3>اصلاح</h3><p class="hint">برای اصلاح، بازرسی را بازگشایی کنید؛ نسخه اصلاحی با شماره جدید (R) ایجاد می‌شود.</p>
      <div class="actions"><button class="btn" data-act="reopen">بازگشایی و اصلاح</button></div></div>
      <div class="danger-zone"><button class="btn danger" data-act="delInsp">حذف این بازرسی</button></div>`;
  }
  const byStep = steps.filter(s => issues.some(x => x.step === s.key));
  const issuesHtml = byStep.length
    ? `<div class="card"><h3>موارد ناقص</h3><p class="hint">پیش از نهایی‌سازی، موارد زیر را تکمیل کنید.</p>${byStep.map(s => `<div class="issue-grp">
        <div class="row-between"><b>${esc(s.title)}</b><button class="btn sm" data-act="gotoStep" data-i="${steps.indexOf(s)}">رفتن به این مرحله</button></div>
        <ul class="errs">${issues.filter(x => x.step === s.key).slice(0, 8).map(x => `<li>${esc(x.msg)}</li>`).join('')}${issues.filter(x => x.step === s.key).length > 8 ? '<li>…</li>' : ''}</ul></div>`).join('')}</div>`
    : `<div class="banner ok">همه مراحل تکمیل شده است. پس از نهایی‌سازی می‌توانید گزارش و ابلاغیه را دریافت کنید.</div>`;
  return `${summary}${issuesHtml}
    <button class="btn primary block big" data-act="finalize" ${issues.length ? 'disabled' : ''}>نهایی‌سازی و صدور گزارش</button>
    <div class="danger-zone"><button class="btn danger" data-act="delInsp">حذف این بازرسی</button></div>`;
}

const progSec = (insp, sec) => {
  const n = sec.items.filter(it => insp.answers[it.id]?.s).length;
  const nc = sec.items.filter(it => insp.answers[it.id]?.s === 'NC').length;
  return `${faDigits(n)} از ${faDigits(sec.items.length)}${nc ? `<i class="sep"></i><span class="t-nc">${faDigits(nc)} نامنطبق</span>` : ''}`;
};

const selField = (label, path, val, opts, ph = '— انتخاب کنید —') =>
  `<label class="fld"><span>${label}</span><select data-f="${path}"><option value="">${ph}</option>${opts.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}" ${val === v ? 'selected' : ''}>${esc(l)}</option>`;
  }).join('')}</select></label>`;

function itemHtml(insp, item, n) {
  const a = insp.answers[item.id] || {};
  const fu = insp.type.kind === 'followup';
  const labels = fu ? { C: 'رفع شده', NC: 'رفع نشده', NA: 'موضوعیت ندارد' } : { C: 'منطبق', NC: 'نامنطبق', NA: 'غیرمرتبط' };
  return `<div class="item s-${a.s || 'none'}${a.s === 'NC' && a.risk === 'X' ? ' imminent' : ''}" id="it-${item.id}">
    <div class="item-q"><span class="num">${faDigits(n)}</span><div><div>${esc(item.text)}</div>
      ${item.ref ? `<div class="ref">${esc(item.ref)}</div>` : ''}
      ${fu && item.prevAction ? `<div class="ref">اقدام ابلاغ‌شده: ${esc(item.prevAction)}</div>` : ''}</div></div>
    <div class="item-row">
      <label class="fld"><span>وضعیت</span><select class="st-sel s-${a.s || 'none'}" data-ans="${item.id}"><option value="">— انتخاب کنید —</option>
        ${['C', 'NC', 'NA'].map(v => `<option value="${v}" ${a.s === v ? 'selected' : ''}>${labels[v]}</option>`).join('')}</select></label>
      ${a.s === 'NC' ? `<label class="fld"><span>سطح خطر</span><select class="st-sel r-${a.risk || 'none'}" data-risk="${item.id}"><option value="">— انتخاب کنید —</option>
        ${RISKS.map(([k, l]) => `<option value="${k}" ${a.risk === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
    </div>
    ${a.s === 'NC' ? `<div class="nc">
      <label class="fld"><span>اقدام اصلاحی لازم</span><textarea data-f="answers.${item.id}.action" rows="2">${esc(a.action)}</textarea></label>
      <label class="fld short"><span>مهلت رفع (روز)${a.risk === 'X' ? ' — فوری' : ''}</span><input inputmode="numeric" data-num data-f="answers.${item.id}.days" value="${esc(faDigits(a.days))}"></label>
    </div>` : ''}
    <input class="note" placeholder="توضیحات (اختیاری)" data-f="answers.${item.id}.note" value="${esc(a.note)}">
  </div>`;
}

function deliverHtml(insp) {
  const d = insp.delivery || {}, st = stats(insp), ro = insp.status === 'final';
  const items = st.ncItems.map(({ item, a }) => `<li class="${a.risk === 'X' ? 't-x' : ''}"><b>${esc(item.text)}</b><br>اقدام لازم: ${esc(a.action || '—')}<br>
    ${a.risk === 'X' ? 'مهلت: فوری (خطر قریب‌الوقوع)' : `مهلت: ${faDigits(a.days || '—')} روز${Jalali.valid(insp.date) && a.days ? ` (تا ${faDigits(Jalali.addDays(insp.date, a.days))})` : ''}`}</li>`).join('');
  return `<div class="card"><h3>ابلاغ در محل <small class="muted-s">(اختیاری)</small></h3>
    <p class="hint">گوشی را به کارفرما یا نماینده او بدهید تا موارد زیر را ببیند و امضا کند. نام و امضای او در گزارش کامل و در کادر «رسید ابلاغ» ابلاغیه چاپ می‌شود. اگر ابلاغ در محل انجام نمی‌شود، این مرحله را خالی بگذارید.</p>
    <div class="notice-prev">${st.nc ? `<b>نواقص قابل ابلاغ (${faDigits(st.nc)} مورد)</b><ol>${items}</ol>` : '<b>این بازرسی نقصی ندارد؛ امضا به‌منزله رؤیت گزارش بازرسی است.</b>'}</div>
  </div>
  <div class="card"><h3>مشخصات شخص ابلاغ‌شونده</h3><div class="grid">
    ${field('نام و نام خانوادگی', 'data-f="delivery.name"', d.name)}
    ${selField('سمت', 'delivery.role', d.role, RECIPIENT_ROLES)}
    ${field('کد ملی (اختیاری)', 'data-f="delivery.nid"', d.nid, 'num')}
    ${field('تاریخ ابلاغ', `data-f="delivery.date" placeholder="${faDigits(Jalali.today())}"`, d.date, 'digits')}
    ${field('ساعت ابلاغ', 'data-f="delivery.time" placeholder="۱۱:۰۰"', d.time, 'digits')}
  </div>
  <h4>امضای ابلاغ‌شونده</h4>
  ${ro ? (d.signature ? `<div class="sig-tap done"><img src="${d.signature}" alt="امضا"></div>` : '<p class="hint">امضا نشده است.</p>')
    : `<button type="button" class="sig-tap ${d.signature ? 'done' : ''}" data-act="rcSign">${d.signature ? `<img src="${d.signature}" alt="امضا"><span>برای امضای مجدد لمس کنید</span>` : '<b>✍ برای امضا لمس کنید</b><span>صفحه امضا به‌صورت تمام‌صفحه باز می‌شود</span>'}</button>
       ${d.signature ? '<div class="actions"><button type="button" class="btn danger" data-act="rcRemove">حذف امضا</button></div>' : ''}`}
  </div>`;
}

function accidentInfoHtml(insp) {
  const ac = insp.accident;
  return `<div class="card acc"><h3>شرح حادثه</h3><div class="grid">
      ${field('تاریخ حادثه', 'data-f="accident.date"', ac.date, 'digits')}
      ${field('ساعت حادثه', 'data-f="accident.time"', ac.time, 'digits')}
      ${field('محل وقوع در کارگاه', 'data-f="accident.location"', ac.location)}
    </div>
    ${field('شرح چگونگی وقوع حادثه', 'data-f="accident.description"', ac.description, 'area')}</div>`;
}
function victimsHtml(insp) {
  const ac = insp.accident;
  return `<div class="card acc"><h3>مصدومان</h3>
    ${ac.victims.map((v, i) => `<div class="sub"><div class="row-between"><b>مصدوم ${faDigits(i + 1)}</b>${ac.victims.length > 1 ? `<button type="button" class="btn sm danger" data-act="rmVictim" data-i="${i}">حذف</button>` : ''}</div><div class="grid">
      ${field('نام و نام خانوادگی', `data-f="accident.victims.${i}.name"`, v.name)}
      ${field('کد ملی', `data-f="accident.victims.${i}.nid"`, v.nid, 'num')}
      ${field('سن', `data-f="accident.victims.${i}.age"`, v.age, 'num')}
      ${selField('جنسیت', `accident.victims.${i}.gender`, v.gender, ['مرد', 'زن'])}
      ${field('شغل / سمت', `data-f="accident.victims.${i}.job"`, v.job)}
      ${field('سابقه کار (سال)', `data-f="accident.victims.${i}.experience"`, v.experience, 'num')}
      ${selField('نوع آسیب', `accident.victims.${i}.injury`, v.injury, INJURIES)}
      ${selField('عضو آسیب‌دیده', `accident.victims.${i}.bodyPart`, v.bodyPart, BODY_PARTS)}
      ${selField('شدت آسیب', `accident.victims.${i}.severity`, v.severity, SEVERITIES)}
    </div></div>`).join('')}
    <button type="button" class="btn sm" data-act="addVictim">+ مصدوم دیگر</button></div>`;
}
function causesHtml(insp) {
  const ac = insp.accident;
  return `<div class="card acc"><h3>شاهدان</h3>
    ${ac.witnesses.map((w, i) => `<div class="sub"><div class="row-between"><b>شاهد ${faDigits(i + 1)}</b><button type="button" class="btn sm danger" data-act="rmWitness" data-i="${i}">حذف</button></div>
      ${field('نام و سمت', `data-f="accident.witnesses.${i}.name"`, w.name)}
      ${field('اظهارات', `data-f="accident.witnesses.${i}.statement"`, w.statement, 'area')}</div>`).join('') || '<p class="hint">شاهدی ثبت نشده است.</p>'}
    <button type="button" class="btn sm" data-act="addWitness">+ شاهد</button></div>
    <div class="card acc"><h3>تحلیل علل</h3>
    ${selField('نوع حادثه', 'accident.accidentType', ac.accidentType, ACCIDENT_TYPES)}
    ${field('علت مستقیم حادثه', 'data-f="accident.directCause"', ac.directCause, 'area')}
    ${field('علل ریشه‌ای', 'data-f="accident.rootCause"', ac.rootCause, 'area')}
    <div class="grid">
      ${selField('قصور کارفرما', 'accident.employerFault', ac.employerFault, ['دارد', 'ندارد', 'مشترک'])}
      ${field('سهم قصور کارفرما (درصد)', 'data-f="accident.faultPercent"', ac.faultPercent, 'num')}
    </div>
    ${field('توصیه‌ها برای جلوگیری از تکرار', 'data-f="accident.recommendations"', ac.recommendations, 'area')}
  </div>`;
}

// ----- Workplaces -----
function viewWorkplaces() {
  const q = S.q.trim();
  const list = S.workplaces.filter(w => !q || [w.name, w.employer, w.workshopCode].some(s => (s || '').includes(q)));
  return `<div class="row-between"><h2>کارگاه‌ها</h2><button class="btn primary" data-act="wpNew">+ کارگاه جدید</button></div>
    <input class="search" placeholder="جستجو" data-act-input="searchWp" value="${esc(S.q)}">
    <div id="list">${list.map(w => {
      const n = S.inspections.filter(i => i.workplace.wpId === w.id).length;
      return `<button class="card list-item" data-act="wpOpen" data-id="${w.id}"><div class="li-top"><b>${esc(w.name)}</b><small>${faDigits(n)} بازرسی</small></div>
        <div class="li-meta">${esc(w.employer)}${w.workshopCode ? '<i class="sep"></i>کد ' + esc(faDigits(w.workshopCode)) : ''}</div></button>`;
    }).join('') || '<div class="empty">کارگاهی ثبت نشده است.</div>'}</div>`;
}
function viewWpEdit() {
  const w = S.params.wp;
  return `<h2>${w.name ? esc(w.name) : 'کارگاه جدید'}</h2><div class="card"><div class="grid">
    ${WP_FIELDS.map(([k, l, kind]) => field(l, `data-w="${k}"`, w[k], kind)).join('')}</div></div>
    <div class="actions"><button class="btn primary" data-act="wpSave">ذخیره</button>
    ${S.workplaces.some(x => x.id === w.id) ? `<button class="btn" data-act="wpInspect">بازرسی جدید برای این کارگاه</button><button class="btn danger" data-act="wpDel">حذف</button>` : ''}
    <button class="btn ghost" data-act="go" data-v="workplaces">بازگشت</button></div>`;
}

// ----- Settings -----
function viewSettings() {
  const st = S.settings, p = st.profile, lh = st.letterhead;
  return `<h2>تنظیمات</h2>
  <div class="card"><h3>مشخصات بازرس</h3><div class="grid">
    ${field('نام و نام خانوادگی', 'data-s="profile.name"', p.name)}
    ${field('کد بازرس (در شماره گزارش‌ها)', 'data-s="profile.code"', p.code, 'num')}
    ${field('عنوان / سمت', 'data-s="profile.title"', p.title)}
  </div></div>
  <div class="card"><h3>امضای بازرس</h3>
    ${st.signature ? `<div class="sig-cur"><img src="${st.signature}" alt="امضا"></div>` : '<p class="hint">امضایی ثبت نشده است.</p>'}
    <p class="hint">کادر را لمس کنید تا صفحه امضا تمام‌صفحه باز شود، یا تصویر امضای اسکن‌شده را بارگذاری کنید.</p>
    <div class="actions"><button class="btn primary" data-act="sigSign">${st.signature ? 'امضای مجدد' : '✍ امضا'}</button><button class="btn" data-act="sigUpload">بارگذاری تصویر</button>${st.signature ? '<button class="btn danger" data-act="sigRemove">حذف امضا</button>' : ''}</div>
  </div>
  <div class="card"><h3>سربرگ و لوگو</h3>
    <div class="logo-row">${st.logo ? `<img class="logo-prev" src="${st.logo}" alt="لوگو">` : '<div class="logo-prev empty-logo">بدون لوگو</div>'}
      <div class="actions"><button class="btn" data-act="logoUpload">بارگذاری لوگو</button>${st.logo ? '<button class="btn danger" data-act="logoRemove">حذف</button>' : ''}</div></div>
    <div class="grid">
      ${field('سطر اول سربرگ', 'data-s="letterhead.line1"', lh.line1)}
      ${field('سطر دوم سربرگ', 'data-s="letterhead.line2"', lh.line2)}
      ${field('سطر سوم سربرگ', 'data-s="letterhead.line3"', lh.line3)}
      ${field('پانویس (نشانی و تلفن اداره)', 'data-s="letterhead.footer"', lh.footer)}
    </div></div>
  ${installCard()}
  ${dataCard()}
  <div class="card"><h3>چک‌لیست‌ها</h3>
    <p class="hint">نسخه بسته چک‌لیست فعلی: ${esc(faDigits(S.pkg.version))}${S.pkg.updatedAt ? ' — ' + faDigits(Jalali.fromDate(new Date(S.pkg.updatedAt))) : ''}. فایل بسته چک‌لیست را از مدیر دریافت و وارد کنید.</p>
    <div class="actions"><button class="btn" data-act="importPkg">ورود بسته چک‌لیست</button><button class="btn ghost" data-act="go" data-v="admin">بخش مدیریت</button></div>
  </div>
  <p class="hint center">نسخه برنامه ${faDigits(APP_VERSION)}</p>`;
}

function installCard() {
  const standalone = matchMedia('(display-mode: standalone)').matches;
  const isFile = location.protocol === 'file:';
  const storage = { indexeddb: 'پایگاه داده مرورگر', localstorage: 'حافظه محدود مرورگر', memory: 'موقت — ذخیره نمی‌شود' }[DB.backend];
  let install;
  if (standalone) install = '<p class="hint">برنامه روی این دستگاه نصب شده است.</p>';
  else if (S.installPrompt) install = '<div class="actions"><button class="btn primary" data-act="install">نصب برنامه روی این دستگاه</button></div>';
  else if (isFile) install = '<p class="hint">نسخه فایل قابل نصب نیست. برای نصب، نسخه وب برنامه را با Chrome باز کنید و از منوی ⋮ گزینه «Install app / افزودن به صفحه اصلی» را بزنید.</p>';
  else install = '<p class="hint">از منوی ⋮ در Chrome گزینه «Install app» یا «Add to Home screen» را بزنید.</p>';
  return `<div class="card"><h3>نصب و ذخیره‌سازی</h3>${install}
    <p class="hint">محل ذخیره اطلاعات: ${storage}<i class="sep"></i>ذخیره‌سازی ماندگار: ${S.persisted ? 'فعال (مرورگر اطلاعات را خودکار پاک نمی‌کند)' : 'غیرفعال (با کمبود فضای گوشی ممکن است پاک شود؛ پشتیبان بگیرید)'}</p></div>`;
}

function dataCard() {
  const st = S.settings, months = monthsWithData();
  if (!S.exportMonth || !months.some(m => m.key === S.exportMonth)) S.exportMonth = months[0]?.key;
  return `<div class="card"><h3>داده‌ها و پشتیبان</h3>

}

const mvBtns = (what, i, n, si) => `<button class="btn sm" data-act="mv${what}" data-d="-1" data-i="${i}" ${si != null ? `data-si="${si}"` : ''} ${i === 0 ? 'disabled' : ''}>▲</button><button class="btn sm" data-act="mv${what}" data-d="1" data-i="${i}" ${si != null ? `data-si="${si}"` : ''} ${i === n - 1 ? 'disabled' : ''}>▼</button>`;

// ---------- Actions ----------
function refreshItem(insp, itemId) {
  const sec = insp.type.sections.find(s => s.items.some(i => i.id === itemId));
  const idx = sec.items.findIndex(i => i.id === itemId);
  $('#it-' + itemId).outerHTML = itemHtml(insp, sec.items[idx], idx + 1);
  $('#pg-' + sec.id).innerHTML = progSec(insp, sec);
  $('#stepper').outerHTML = stepperHtml(insp, stepsOf(insp), stepIndex(insp), issuesOf(insp));
}
function setAnswer(insp, id, v) {
  const a = insp.answers[id] || (insp.answers[id] = {});
  a.s = v || undefined;
  if (a.s === 'NC' && insp.type.kind === 'followup') {
    const it = insp.type.sections[0].items.find(i => i.id === id);
    if (!a.action) a.action = it.prevAction;
    if (!a.risk) a.risk = it.prevRisk;
  }
  saveInsp(insp); refreshItem(insp, id);
}
function setStep(i) {
  const insp = curInsp();
  S.params = { ...S.params, step: i };
  if (insp.status !== 'final') { insp.step = i; saveInsp(insp); }
  pushNav(); render(); window.scrollTo(0, 0);
}
async function loadImage(file, maxSide) {
  try { return await compressImage(file, maxSide, 'image/png'); } catch (e) {
    modal('تصویر قابل استفاده نیست', 'این فرمت تصویر در مرورگر پشتیبانی نمی‌شود (مثلاً HEIC). لطفاً تصویر را با فرمت PNG یا JPG انتخاب کنید.');
    return null;
  }
}
const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

const ACT = {
  go: (el) => { S.q = ''; go(el.dataset.v); },
  open: async (el) => {
    const insp = S.inspections.find(i => i.id === el.dataset.id);
    go('edit', { id: insp.id });
    for (const p of insp.photos) if (!S.photoCache[p.id]) S.photoCache[p.id] = (await DB.get('photos', p.id))?.data;
    if (insp.photos.length && S.view === 'edit') render();
  },
  newType: (el) => { S.params = { ...S.params, typeId: el.dataset.v, prevId: null }; render(); },
  newPrev: (el) => { S.params.prevId = el.dataset.v; render(); },
  create: async () => {
    const p = S.settings.profile;
    if (!p.code) { await modal('کد بازرس', 'ابتدا در تنظیمات، کد بازرس را وارد کنید؛ این کد در شماره گزارش‌ها استفاده می‌شود.'); return go('settings'); }
    const insp = await createInspection(S.params.typeId, S.params.wpId, S.params.prevId);
    go('edit', { id: insp.id });
  },
  stepPrev: () => setStep(stepIndex(curInsp()) - 1),
  stepNext: async () => {
    flushAll();
    const insp = curInsp(), cur = stepIndex(insp), step = stepsOf(insp)[cur];
    const missing = insp.status === 'final' ? [] : issuesOf(insp).filter(x => x.step === step.key);
    if (missing.length && !await modal('این مرحله کامل نیست', `<ul class="errs">${missing.slice(0, 10).map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul><p class="hint">می‌توانید بعداً به این مرحله برگردید؛ پیش از نهایی‌سازی باید کامل شود.</p>`, [['تکمیل این مرحله', false], ['ادامه به مرحله بعد', true]])) return;
    setStep(cur + 1);
  },
  gotoStep: (el) => setStep(+el.dataset.i),
  startFu: (el) => go('new', { typeId: S.pkg.types.find(t => t.kind === 'followup').id, prevId: el.dataset.id }),
  printDash: () => printDoc(renderDashPrint(), `گزارش-عملکرد-${Jalali.today().replace(/\//g, '-')}`),
  install: async () => { if (S.installPrompt) { S.installPrompt.prompt(); await S.installPrompt.userChoice; S.installPrompt = null; render(); } },
  fillAll: (el) => {
    const insp = curInsp(), sec = insp.type.sections.find(s => s.id === el.dataset.sec);
    let n = 0;
    sec.items.forEach(it => {
      const a = insp.answers[it.id] || (insp.answers[it.id] = {});
      if (a.s !== 'NC' && a.s !== el.dataset.v) { a.s = el.dataset.v; n++; }
    });
    saveInsp(insp); render();
    toast(`${faDigits(n)} مورد تغییر کرد`);
  },
  rcSign: async () => {
    const sig = await signFullscreen('امضای شخص ابلاغ‌شونده');
    if (!sig) return;
    const insp = curInsp(), now = new Date();
    const d = insp.delivery = insp.delivery || {};
    d.signature = sig;
    if (!d.date) d.date = Jalali.today();
    if (!d.time) d.time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    saveInsp(insp); toast('امضای ابلاغ‌شونده ثبت شد'); render();
  },
  rcRemove: async () => {
    if (!await confirmBox('حذف امضا', 'امضای شخص ابلاغ‌شونده حذف شود؟', 'حذف')) return;
    const insp = curInsp(); insp.delivery.signature = null; saveInsp(insp); render();
  },
  addVictim: () => { const i = curInsp(); i.accident.victims.push({}); saveInsp(i); render(); },
  rmVictim: async (el) => { const i = curInsp(); if (await confirmBox('حذف مصدوم', 'این مصدوم حذف شود؟', 'حذف')) { i.accident.victims.splice(+el.dataset.i, 1); saveInsp(i); render(); } },
  addWitness: () => { const i = curInsp(); i.accident.witnesses.push({}); saveInsp(i); render(); },
  rmWitness: (el) => { const i = curInsp(); i.accident.witnesses.splice(+el.dataset.i, 1); saveInsp(i); render(); },
  addPhoto: async () => {
    const insp = curInsp(), files = await pickFile('image/*', true);
    for (const f of files) {
      let data;
      try { data = await compressImage(f); } catch (e) { modal('تصویر قابل استفاده نیست', `فرمت فایل «${esc(f.name)}» پشتیبانی نمی‌شود. از تصویر PNG یا JPG استفاده کنید.`); continue; }
      const id = uid();
      await DB.put('photos', { id, inspectionId: insp.id, data });
      S.photoCache[id] = data; insp.photos.push({ id, caption: '' });
    }
    saveInsp(insp); render();
  },
  rmPhoto: async (el) => {
    const insp = curInsp();
    if (!await confirmBox('حذف تصویر', 'این تصویر حذف شود؟', 'حذف')) return;
    const [p] = insp.photos.splice(+el.dataset.i, 1);
    await DB.del('photos', p.id); saveInsp(insp); render();
  },
  finalize: async () => {
    flushAll();
    const insp = curInsp();
    if (issuesOf(insp).length) return render();
    if (!S.settings.signature && !await confirmBox('امضا ثبت نشده', 'امضای بازرس در تنظیمات ثبت نشده و گزارش بدون امضا چاپ می‌شود. ادامه می‌دهید؟', 'ادامه')) return;
    if (!await confirmBox('نهایی‌سازی', 'پس از نهایی‌سازی، بازرسی قابل ویرایش نیست مگر با بازگشایی و ایجاد نسخه اصلاحی. ادامه می‌دهید؟', 'نهایی‌سازی')) return;
    insp.status = 'final'; insp.finalizedAt = new Date().toISOString();
    insp.history.push({ rev: insp.rev, finalizedAt: insp.finalizedAt });
    await DB.put('inspections', insp); await upsertWorkplaceFrom(insp);
    S.params = { id: insp.id }; pushNav(true);
    toast('بازرسی نهایی شد'); render(); window.scrollTo(0, 0);
  },
  reopen: async () => {
    const insp = curInsp();
    if (!await confirmBox('بازگشایی', `با بازگشایی، نسخه اصلاحی ${esc(insp.serial)}-R${faDigits(insp.rev + 1)} ایجاد می‌شود و گزارش‌های قبلی دیگر معتبر نیستند. امضای ابلاغ در محل نیز حذف می‌شود و باید برای نسخه اصلاحی دوباره گرفته شود. ادامه می‌دهید؟`, 'بازگشایی')) return;
    insp.rev++; insp.status = 'draft'; insp.delivery = null; insp.step = stepsOf(insp).length - 1;
    S.params = { id: insp.id }; pushNav(true);
    await DB.put('inspections', insp); render();
  },
  delInsp: async () => {
    const insp = curInsp();
    if (!await confirmBox('حذف بازرسی', `بازرسی ${esc(serialOf(insp))} و تصاویر آن برای همیشه حذف شود؟`, 'حذف')) return;
    for (const p of insp.photos) await DB.del('photos', p.id);
    await DB.del('inspections', insp.id);
    S.inspections = S.inspections.filter(i => i !== insp);
    go('home');
  },
  printReport: () => printInspection(curInsp(), 'report'),
  printNotice: () => printInspection(curInsp(), 'notice'),

  delItem: (el) => { S.pkg.types[S.params.i].sections[+el.dataset.si].items.splice(+el.dataset.ii, 1); savePkg(); render(); },
  mvSec: (el) => { move(S.pkg.types[S.params.i].sections, +el.dataset.i, +el.dataset.d); savePkg(); render(); },
  mvItem: (el) => { move(S.pkg.types[S.params.i].sections[+el.dataset.si].items, +el.dataset.i, +el.dataset.d); savePkg(); render(); }
};

// ---------- Event wiring ----------
function onInput(e) {
  const el = e.target;
  if (el.id === 'npw') { S._npw = el.value; return; }
  if (el.hasAttribute('data-modal-input')) { S._mi = el.value; return; }
  if (el.dataset.toggle) { S[el.dataset.toggle] = el.checked; return; }
  let v = el.value;
  if (el.hasAttribute('data-num')) v = enDigits(v);
  if (el.tagName === 'SELECT' && e.type === 'input') return; // selects are handled once, on change
  if (el.dataset.ans || el.dataset.risk) {
    const insp = curInsp(); if (!insp || insp.status === 'final') return;
    if (el.dataset.ans) setAnswer(insp, el.dataset.ans, v);
    else { insp.answers[el.dataset.risk].risk = v || undefined; saveInsp(insp); refreshItem(insp, el.dataset.risk); }
    return;
  }
  if (el.hasAttribute('data-step-jump')) return setStep(+v);
  if (el.dataset.f) {
    const insp = curInsp(); if (!insp || insp.status === 'final') return;
    setPath(insp, el.dataset.f, v); saveInsp(insp);
  } else if (el.dataset.s) { setPath(S.settings, el.dataset.s, v); saveSettings(); }
  else if (el.dataset.w) { S.params.wp[el.dataset.w] = v; }
  else if (el.dataset.p) { setPath(S.pkg, el.dataset.p, v); savePkg(); }
  else if (el.dataset.actInput === 'search') { S.q = v; $('#list').innerHTML = listHtml(); }
  else if (el.dataset.actInput === 'searchWp') { S.q = v; const pos = el.selectionStart; render(); const s = $('.search'); s.focus(); s.setSelectionRange(pos, pos); }
  else if (el.dataset.actChange === 'newWp') { S.params.wpId = v || null; }
  else if (el.dataset.actChange === 'dashPeriod') { S.dashPeriod = v; render(); }
  else if (el.dataset.actChange === 'exportMonth') { S.exportMonth = v; }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); }
});
document.addEventListener('input', onInput);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') onInput(e); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; if (S.view === 'settings') render(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && document.querySelector('link[rel=manifest]'))
  navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Boot ----------
(async function boot() {
  try {
    await DB.init();
    await loadAll();
    if (navigator.storage?.persist) S.persisted = await navigator.storage.persist().catch(() => false);
    pushNav(true); render();
  } catch (err) {
    $('#app').innerHTML = `<main class="wrap"><div class="banner err">برنامه اجرا نشد؛ آن را با Chrome باز کنید.<br><small dir="ltr">${esc(err && err.message)}</small></div></main>`;
  }
})();
</script>
</body>
